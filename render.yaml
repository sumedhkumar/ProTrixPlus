# Render Blueprint for a free, temporary deploy of the S0 mock stack.
# Usage: Render dashboard -> New -> Blueprint -> pick this repo -> it reads this file.
# See docs/DEPLOY-RENDER.md for the full walkthrough (Upstash Redis setup etc.).
#
# api + worker run in ONE free Web Service (infra/render/combined.Dockerfile)
# because Render has no free Background Worker plan. Local dev is unaffected:
# infra/docker-compose.yml still runs api/Dockerfile and worker/Dockerfile as
# separate containers.

databases:
  - name: protrixplus-db
    databaseName: protrix
    user: protrix
    plan: free

envVarGroups:
  - name: protrixplus-shared
    envVars:
      - key: PROTRIX_WEBHOOK_SHARED_SECRET
        generateValue: true

services:
  - type: web
    name: protrixplus-api
    runtime: docker
    dockerfilePath: ./infra/render/combined.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: protrixplus-shared
      # "local" (not "prod") is required: api/app/main.py refuses to start
      # with app_env=prod while dev-identity mock auth is enabled, and this
      # whole free/temp deploy relies on that mock auth (no real credentials).
      - key: PROTRIX_APP_ENV
        value: local
      - key: PROTRIX_LOG_LEVEL
        value: INFO
      - key: PROTRIX_DATABASE_URL
        fromDatabase:
          name: protrixplus-db
          property: connectionString
      - key: PROTRIX_REDIS_URL
        sync: false # paste the Upstash "rediss://" URL here after creating it
      - key: PROTRIX_SIGNAL_STREAM
        value: protrix.signals.v1
      - key: PROTRIX_SIGNAL_CONSUMER_GROUP
        value: protrix-workers
      - key: PROTRIX_DEV_IDENTITY_ENABLED
        value: "true"
      - key: PROTRIX_DEV_JWT_SECRET
        generateValue: true
      - key: PROTRIX_DEV_JWT_ISSUER
        value: protrixplus-dev-identity
      - key: PROTRIX_EMAIL_BACKEND
        value: mock
      - key: PROTRIX_FRONTEND_BASE_URL
        value: https://protrixplus-web.onrender.com
      - key: PROTRIX_METAAPI_TOKEN
        value: ""
      # worker-only settings (same container, see combined-entrypoint.sh)
      - key: PROTRIX_WORKER_NAME
        value: worker-1
      - key: PROTRIX_WORKER_HEALTH_PORT
        value: "8001" # avoid colliding with uvicorn on :8000
      - key: PROTRIX_EXECUTION_ADAPTER
        value: mock
      - key: PROTRIX_METAAPI_TRADING_ENABLED
        value: "false"
      - key: PROTRIX_METAAPI_MAGIC
        value: "260910"
      - key: PROTRIX_METAAPI_TIMEOUT_SECONDS
        value: "30"

  - type: web
    name: protrixplus-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /login
    envVars:
      - fromGroup: protrixplus-shared
      - key: PROTRIX_API_URL
        value: https://protrixplus-api.onrender.com
