name: ci

on:
  push:
  pull_request:

# No secrets are used anywhere in this workflow.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "contracts/python[dev]"
      - name: ruff
        run: |
          ruff check contracts/python tests infra/scripts
          ruff format --check contracts/python tests infra/scripts
      - name: mypy
        run: mypy contracts/python/protrix_contracts
      - name: pytest
        run: pytest contracts/python -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: protrix
          POSTGRES_PASSWORD: protrix
          POSTGRES_DB: protrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U protrix" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      PROTRIX_DATABASE_URL: postgresql+psycopg://protrix:protrix@localhost:5432/protrix
      PROTRIX_REDIS_URL: redis://localhost:6379/0
      PROTRIX_TEST_DATABASE_URL: postgresql+psycopg://protrix:protrix@localhost:5432/protrix
      PROTRIX_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e contracts/python -r api/requirements-dev.txt
      - name: ruff
        run: |
          cd api
          ruff check .
          ruff format --check .
      - name: mypy
        run: cd api && mypy app
      - name: alembic upgrade
        run: cd api && alembic upgrade head
      - name: alembic migration check (no model/DB drift)
        run: cd api && alembic check
      - name: pytest
        run: cd api && pytest -q

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: protrix
          POSTGRES_PASSWORD: protrix
          POSTGRES_DB: protrix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U protrix" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      PROTRIX_DATABASE_URL: postgresql+psycopg://protrix:protrix@localhost:5432/protrix
      PROTRIX_REDIS_URL: redis://localhost:6379/0
      PROTRIX_TEST_DATABASE_URL: postgresql+psycopg://protrix:protrix@localhost:5432/protrix
      PROTRIX_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e contracts/python -r worker/requirements-dev.txt
      - name: ruff
        run: |
          cd worker
          ruff check .
          ruff format --check .
      - name: mypy
        run: cd worker && mypy app
      - name: pytest
        run: cd worker && pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PROTRIX_API_URL: http://localhost:8000

  integration:
    runs-on: ubuntu-latest
    needs: [contracts, api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build + start the stack
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml --env-file infra/.env up --build -d

      - name: wait for health
        run: |
          for svc in "http://localhost:8000" "http://localhost:8100" "http://localhost:3000/login"; do
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$svc/health" 2>/dev/null || curl -s -o /dev/null -w "%{http_code}" "$svc")
              if [ "$code" = "200" ]; then echo "ok: $svc"; break; fi
              sleep 2
              if [ "$i" = "60" ]; then echo "timeout: $svc"; docker compose -f infra/docker-compose.yml logs; exit 1; fi
            done
          done

      - name: integration tests (slice, duplicate, restart, timeout)
        env:
          PROTRIX_DATABASE_URL: postgresql+psycopg://protrix:protrix@localhost:5432/protrix
          PROTRIX_REDIS_URL: redis://localhost:6379/0
          PROTRIX_COMPOSE_FILE: infra/docker-compose.yml
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
          pytest tests -q

      - name: playwright e2e
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: dump logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

      - name: tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
